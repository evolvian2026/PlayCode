# Local infrastructure for development. The API and web app run on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: playcode
      POSTGRES_PASSWORD: playcode
      POSTGRES_DB: playcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
