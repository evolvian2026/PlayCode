name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playcode
          POSTGRES_PASSWORD: playcode
          POSTGRES_DB: playcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playcode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Java runs the content checks for Java questions; Python and gcc ship with the runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://playcode:playcode@localhost:5432/playcode_test
      - run: pnpm --filter @playcode/web build
